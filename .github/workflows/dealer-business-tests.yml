name: Dealer Business Logic Tests

on:
  push:
    branches:
      - feature/dealer-inventory-sales
    paths:
      - "index.html"
      - "tests/**"
      - ".github/workflows/dealer-business-tests.yml"
  pull_request:
    paths:
      - "index.html"
      - "tests/**"
      - ".github/workflows/dealer-business-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  business-logic:
    name: Run dealer business logic regression tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate Cloudflare Worker build (dry run)
        run: npx --yes wrangler@4 deploy --dry-run
      - name: Run regression tests
        run: node tests/business-logic.test.cjs
